name: checks

on:
  push:
    branches: [main]
    # The six-hourly news commit does not change the site, and the news
    # workflow itself validates news.json before committing it.
    paths-ignore: ['news.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: News parser unit tests
        run: python3 -m unittest discover -s scripts -v

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: npm test
